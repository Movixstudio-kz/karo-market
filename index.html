<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KARO Market — бесплатные объявления Караганды</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f4f5f7;color:#222}
    header{background:linear-gradient(135deg,#111827,#2563eb);color:white;padding:35px 20px;text-align:center}
    header h1{font-size:34px;margin-bottom:10px}
    header p{font-size:17px;opacity:.9}
    .container{max-width:1100px;margin:auto;padding:25px 15px}
    .btn{border:0;cursor:pointer;display:inline-block;padding:13px 20px;border-radius:12px;text-decoration:none;font-weight:bold;color:white;background:#16a34a}
    .btn.blue{background:#229ed9}.btn.dark{background:#111827}.btn.gray{background:#6b7280}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
    .section-title{font-size:24px;margin:30px 0 15px}
    .categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
    .category{background:white;padding:16px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.06);text-align:center;font-weight:bold;cursor:pointer}
    .category.active{outline:3px solid #2563eb}
    .ads{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:15px}
    .ad-card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.08)}
    .ad-img{height:150px;background:#d1d5db;display:flex;align-items:center;justify-content:center;color:#555}
    .ad-content{padding:16px}
    .ad-content h3{font-size:19px;margin-bottom:8px}
    .price{font-size:20px;color:#16a34a;font-weight:bold;margin-bottom:8px}
    .meta{color:#666;font-size:14px;margin-bottom:12px}
    .desc{font-size:14px;line-height:1.5;margin-bottom:14px}
    form{background:white;padding:20px;border-radius:18px;box-shadow:0 4px 14px rgba(0,0,0,.06);display:grid;gap:12px}
    input,select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px}
    textarea{min-height:95px}
    footer{text-align:center;padding:25px;color:#666;font-size:14px}
    .hidden{display:none}
  </style>
</head>
<body>

<header>
  <h1>KARO Market</h1>
  <p>Бесплатные объявления Караганды</p>
  <div class="actions">
    <button class="btn" onclick="showForm()">+ Подать объявление</button>
    <a class="btn blue" href="https://t.me/auto_importKZ" target="_blank">Telegram</a>
  </div>
</header>

<div class="container">

  <h2 class="section-title">Категории</h2>
  <div class="categories">
    <div class="category active" onclick="filterAds('Все', this)">Все</div>
    <div class="category" onclick="filterAds('Авто', this)">🚗 Авто</div>
    <div class="category" onclick="filterAds('Недвижимость', this)">🏠 Недвижимость</div>
    <div class="category" onclick="filterAds('Работа', this)">💼 Работа</div>
    <div class="category" onclick="filterAds('Услуги', this)">🛠 Услуги</div>
    <div class="category" onclick="filterAds('Аренда', this)">🔨 Аренда</div>
    <div class="category" onclick="filterAds('Техника', this)">📱 Техника</div>
    <div class="category" onclick="filterAds('Животные', this)">🐶 Животные</div>
    <div class="category" onclick="filterAds('Разное', this)">📦 Разное</div>
  </div>

  <div id="formBlock" class="hidden">
    <h2 class="section-title">Подать объявление</h2>
    <form id="adForm">
      <input id="name" placeholder="Ваше имя" required>
      <input id="phone" placeholder="Телефон / WhatsApp" required>
      <select id="category" required>
        <option value="">Выберите категорию</option>
        <option>Авто</option>
        <option>Недвижимость</option>
        <option>Работа</option>
        <option>Услуги</option>
        <option>Аренда</option>
        <option>Техника</option>
        <option>Животные</option>
        <option>Разное</option>
      </select>
      <input id="title" placeholder="Заголовок объявления" required>
      <input id="price" placeholder="Цена, например 15 000 ₸">
      <textarea id="description" placeholder="Описание объявления" required></textarea>
      <button class="btn" type="submit">Отправить на модерацию</button>
    </form>
  </div>

  <h2 class="section-title">Свежие объявления</h2>
  <div id="adsList" class="ads">Загружаем объявления...</div>

</div>

<footer>
  KARO Market © 2026 — бесплатные объявления Караганды
</footer>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw9WM_RGBvHZPkbqkp4cFF_PwHkAsQy8dEkOOj5Vbyh1l2ePpBlhaV8QDxjX4HZKp8x/exec";

let allAds = [];
let currentCategory = "Все";

function showForm() {
  document.getElementById("formBlock").classList.toggle("hidden");
  window.scrollTo({ top: document.getElementById("formBlock").offsetTop - 20, behavior: "smooth" });
}

function normalizePhone(phone) {
  return phone.replace(/\D/g, "").replace(/^8/, "7");
}

function renderAds() {
  const adsList = document.getElementById("adsList");
  let filtered = currentCategory === "Все"
    ? allAds
    : allAds.filter(ad => ad.category === currentCategory);

  if (!filtered.length) {
    adsList.innerHTML = "<p>Пока нет одобренных объявлений в этой категории.</p>";
    return;
  }

  adsList.innerHTML = filtered.map(ad => {
    const phone = normalizePhone(ad.phone || "");
    return `
      <div class="ad-card">
        <div class="ad-img">Фото скоро добавим</div>
        <div class="ad-content">
          <h3>${ad.title || "Без названия"}</h3>
          <div class="price">${ad.price || "Цена не указана"}</div>
          <div class="meta">Караганда • ${ad.category || "Разное"}</div>
          <div class="desc">${ad.description || ""}</div>
          <a class="btn dark" target="_blank" href="https://wa.me/${phone}?text=Здравствуйте! Интересует объявление: ${encodeURIComponent(ad.title || "")}">
            Связаться
          </a>
        </div>
      </div>
    `;
  }).join("");
}

function filterAds(category, el) {
  currentCategory = category;
  document.querySelectorAll(".category").forEach(c => c.classList.remove("active"));
  el.classList.add("active");
  renderAds();
}

async function loadAds() {
  try {
    const res = await fetch(WEB_APP_URL);
    allAds = await res.json();
    renderAds();
  } catch (e) {
    document.getElementById("adsList").innerHTML = "<p>Не удалось загрузить объявления.</p>";
  }
}

document.getElementById("adForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    category: document.getElementById("category").value,
    title: document.getElementById("title").value,
    price: document.getElementById("price").value,
    description: document.getElementById("description").value
  };

  try {
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(data)
    });

    alert("Объявление отправлено на модерацию!");
    this.reset();
    document.getElementById("formBlock").classList.add("hidden");
  } catch (e) {
    alert("Ошибка отправки. Попробуйте позже.");
  }
});

loadAds();
</script>

</body>
</html>
