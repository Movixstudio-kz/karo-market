<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добавить мастера | KARO Master</title>
  <meta name="description" content="Добавьте мастера или бригаду в каталог KARO Master. Заявка уходит на модерацию и в Telegram.">
  <meta name="robots" content="index, follow">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">K</span><span>KARO <strong>Master</strong></span></a>
    <nav class="top-nav">
      <a href="index.html">Главная</a>
      <a href="masters.html">Каталог</a>
      <a href="vip.html">VIP</a>
    </nav>
  </header>

  <main>
    <section class="section split">
      <div>
        <p class="eyebrow">Заявка на модерацию</p>
        <h1>Добавить мастера</h1>
        <p class="muted">Заполните карточку мастера. Мы проверим данные и добавим анкету в каталог после модерации.</p>
        <div class="note" id="formSuccess" hidden>Ваша заявка принята. После проверки карточка появится в каталоге.</div>
      </div>
      <form class="add-form" id="addMasterForm">
        <label><span>Имя мастера / название бригады</span><input name="name" required placeholder="Бригада Ерлана"></label>
        <label><span>Телефон для связи</span><input name="phone" required placeholder="+77001234567"></label>
        <div class="form-row">
          <label><span>Город</span><input name="city" required placeholder="Алматы"></label>
          <label><span>Район</span><input name="district" required placeholder="Ауэзовский"></label>
        </div>
        <label><span>Категория</span><select name="category" required id="formCategory"></select></label>
        <label><span>Услуги и опыт</span><textarea name="servicesExperience" required placeholder="Например: сантехника, замена труб, установка смесителей. Опыт 8 лет, выезд по Алматы."></textarea></label>
        <div class="form-row">
          <label><span>Цена от, тг</span><input name="price" required inputmode="numeric" placeholder="10000"></label>
          <label><span>Районы выезда</span><input name="serviceArea" placeholder="Ауэзовский, Бостандыкский"></label>
        </div>
        <label><span>Описание</span><textarea name="description" required placeholder="Кратко опишите опыт, районы выезда и сильные стороны"></textarea></label>
        <label><span>Фото мастера или логотип</span><input name="photoFile" type="file" accept="image/*"></label>
        <label><span>Фото работ, до 10 фото</span><input name="workFiles" type="file" accept="image/*" multiple></label>
        <div class="form-row">
          <label><span>Telegram</span><input name="telegram" placeholder="@username"></label>
          <label><span>Instagram</span><input name="instagram" placeholder="@instagram"></label>
        </div>
        <label><span>Сайт</span><input name="website" placeholder="https://"></label>
        <label class="check-line"><input name="vip" type="checkbox"><span>Хочу VIP-размещение</span></label>
        <button class="btn btn-primary" type="submit">Отправить заявку</button>
      </form>
    </section>
  </main>

  <footer class="site-footer"><span>KARO Master</span><span>Добавление мастера</span></footer>
  <script src="script.js"></script>
</body>
</html>
