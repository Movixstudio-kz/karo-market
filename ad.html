<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Объявление — KARO Market</title>
  <meta name="description" content="Объявление на KARO Market — бесплатные объявления Караганды.">

  <meta property="og:title" content="KARO Market — объявление">
  <meta property="og:description" content="Смотрите объявление на KARO Market — бесплатные объявления Караганды.">

  <meta property="og:url" content="https://movixstudio-kz.github.io/karo-market/ad.html">

<meta name="twitter:title" content="KARO Market — объявление">
<meta name="twitter:description" content="Смотрите объявление на KARO Market">
<meta name="twitter:image" content="https://movixstudio-kz.github.io/karo-market/karo-market-preview.png">

  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,sans-serif;background:#f4f5f7;color:#111827}
    header{background:linear-gradient(135deg,#111827,#2563eb);color:white;padding:26px 20px}
    header .wrap{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}
    header a{color:white;text-decoration:none;font-weight:bold}
    .container{max-width:1100px;margin:auto;padding:24px 15px}
    .ad-page{display:grid;grid-template-columns:1.3fr .7fr;gap:20px}
    .card{background:white;border-radius:18px;box-shadow:0 4px 15px rgba(0,0,0,.08);padding:18px}
    .main-photo{height:460px;background:#d1d5db;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center}
    .main-photo img{width:100%;height:100%;object-fit:contain;background:#111;cursor:zoom-in}
    .thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .thumbs img{width:80px;height:70px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid transparent}
    .thumbs img.active{border-color:#2563eb}
    h1{font-size:30px;margin-bottom:12px}
    .price{font-size:30px;color:#16a34a;font-weight:bold;margin-bottom:14px}
    .meta{color:#666;margin-bottom:14px;line-height:1.6}
    .desc{line-height:1.7;white-space:pre-line;margin-top:16px}
    .btn{display:block;text-align:center;padding:15px 18px;border-radius:12px;text-decoration:none;font-weight:bold;color:white;background:#16a34a;margin-top:14px}
    .btn.dark{background:#111827}
    .btn.share-btn{
  background:linear-gradient(135deg,#229ed9,#2563eb);
  box-shadow:0 6px 16px rgba(37,99,235,.25);
}
.btn.whatsapp-share{background:#25d366}

.btn.share-btn:hover{
  transform:translateY(-2px);
}
    .not-found{text-align:center;padding:60px;background:white;border-radius:18px}
    footer{text-align:center;padding:25px;color:#666;font-size:14px}
    .related{
  margin-top:25px;
}
.related h2{
  margin-bottom:15px;
}
.related-list{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}
.related-item{
  background:white;
  border-radius:14px;
  padding:12px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  cursor:pointer;
}
.related-item:hover{
  transform:translateY(-2px);
}
.related-item img{
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:10px;
}
.related-price{
  color:#16a34a;
  font-weight:bold;
  margin-top:8px;
}
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9999;padding:18px}
    .lightbox.open{display:flex}
    .lightbox-img{max-width:94vw;max-height:86vh;object-fit:contain;border-radius:10px;background:#111}
    .lightbox-close,.lightbox-prev,.lightbox-next{position:absolute;border:0;cursor:pointer;color:white;background:rgba(17,24,39,.72);border-radius:999px;width:48px;height:48px;font-size:30px;display:flex;align-items:center;justify-content:center}
    .lightbox-close{top:18px;right:18px}
    .lightbox-prev{left:18px;top:50%;transform:translateY(-50%)}
    .lightbox-next{right:18px;top:50%;transform:translateY(-50%)}
    .lightbox-counter{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);color:white;background:rgba(17,24,39,.72);border-radius:999px;padding:8px 13px;font-weight:bold}
    @media(max-width:800px){
      .ad-page{grid-template-columns:1fr}
      .main-photo{height:320px}
      header .wrap{flex-direction:column;align-items:flex-start}
      .lightbox-prev,.lightbox-next{width:42px;height:42px;font-size:26px}
    }
  </style>

  <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-7RVQ7B73D9"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());

gtag('config', 'G-7RVQ7B73D9');
</script>
  
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html">← KARO Market</a>
    <span>Бесплатные объявления Караганды</span>
  </div>
</header>

<div class="container">
  <div id="content">Загружаем объявление...</div>
</div>

<footer>
  KARO Market © 2026
</footer>

<div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)" aria-label="Закрыть">×</button>
  <button class="lightbox-prev" onclick="prevPhoto(event)" aria-label="Предыдущее фото">‹</button>
  <img id="lightboxImg" class="lightbox-img" alt="Фото объявления">
  <button class="lightbox-next" onclick="nextPhoto(event)" aria-label="Следующее фото">›</button>
  <div id="lightboxCounter" class="lightbox-counter"></div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwaY69-aqRdGtPy_HVOs_QIYJKDODdTsPtujvSOdqBBTULG2Jb4W2V92zEtmF3Lp9oK/exec";

let currentAd = null;
let currentPhoto = 0;

function getId() {
  return new URLSearchParams(window.location.search).get("id");
}

function normalizePhone(phone) {
  return String(phone || "").replace(/\D/g, "").replace(/^8/, "7");
}

function trackEvent(name, params){
  if (typeof gtag === "function") {
    gtag("event", name, params || {});
  }
}

function formatDate(value) {
  if (!value) return "";
  const d = new Date(value);
  if (isNaN(d)) return "";
  return d.toLocaleDateString("ru-RU") + " " + d.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
}

function setPhoto(index) {
  currentPhoto = index;
  const img = document.getElementById("mainPhoto");
  img.src = currentAd.photos[index];

  document.querySelectorAll(".thumbs img").forEach((el,i) => {
    el.classList.toggle("active", i === index);
  });
}

function updateLightbox() {
  if (!currentAd || !currentAd.photos || !currentAd.photos.length) return;

  document.getElementById("lightboxImg").src = currentAd.photos[currentPhoto];
  document.getElementById("lightboxCounter").textContent =
    (currentPhoto + 1) + " / " + currentAd.photos.length;
}

function openLightbox(index) {
  if (!currentAd || !currentAd.photos || !currentAd.photos.length) return;

  setPhoto(index);
  updateLightbox();
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
  trackPhotoClick();
}

function closeLightbox(event) {
  if (
    event &&
    event.target &&
    event.target.id !== "lightbox" &&
    !event.target.classList.contains("lightbox-close")
  ) {
    return;
  }

  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
}

function nextPhoto(event) {
  if (event) event.stopPropagation();
  if (!currentAd || !currentAd.photos || !currentAd.photos.length) return;

  setPhoto((currentPhoto + 1) % currentAd.photos.length);
  updateLightbox();
}

function prevPhoto(event) {
  if (event) event.stopPropagation();
  if (!currentAd || !currentAd.photos || !currentAd.photos.length) return;

  setPhoto((currentPhoto - 1 + currentAd.photos.length) % currentAd.photos.length);
  updateLightbox();
}

function renderAd(ad) {
  const content = document.getElementById("content");

  if (!ad || !ad.id) {
    content.innerHTML = `
      <div class="not-found">
        <h2>Объявление не найдено</h2>
        <p>Возможно, оно ещё не одобрено модератором или было удалено.</p>
        <br>
        <a href="index.html">Вернуться на главную</a>
      </div>
  <div class="related">
  <h2>Похожие объявления</h2>
  <div id="relatedAds" class="related-list">
    Загружаем...
  </div>
</div>  `;
    return;
  }

  currentAd = ad;

  const photos = ad.photos || [];
  const phone = normalizePhone(ad.phone);
  const whatsappText = encodeURIComponent("Здравствуйте! Интересует объявление #" + ad.id + ": " + (ad.title || ""));
  const wa = phone ? "https://wa.me/" + phone + "?text=" + whatsappText : "#";

  document.title = (ad.title || "Объявление") + " — KARO Market";

  content.innerHTML = `
    <div class="ad-page">
      <div class="card">
        <div class="main-photo">
          ${photos.length ? `<img id="mainPhoto" src="${photos[0]}" alt="Фото объявления" onclick="openLightbox(currentPhoto)">` : "Фото нет"}
        </div>

        ${photos.length > 1 ? `
          <div class="thumbs">
            ${photos.map((p,i)=>`<img src="${p}" class="${i===0?'active':''}" onclick="setPhoto(${i});">`).join("")}
          </div>
        ` : ""}
      </div>

      <div class="card">
        <h1>${ad.title || "Без названия"}</h1>
       <div class="price">
  ${ad.category === "Отдам даром"
    ? "🎁 Бесплатно"
    : (ad.price || "Цена не указана")}
</div>

        <div class="meta">
          № объявления: <b>#${ad.id}</b><br>
          Категория: ${ad.category || "Разное"}<br>
          Город: Караганда<br>
          Дата: ${formatDate(ad.date)}<br>
          Просмотры: 👁 ${ad.views || 0}
        </div>

       <a class="btn" href="${wa}" target="_blank" onclick="trackWhatsAppClick()">Написать в WhatsApp</a>
    <button class="btn share-btn" onclick="shareAd()">
  📤 Поделиться объявлением
</button>
    <a class="btn whatsapp-share" href="${getWhatsAppShareUrl()}" target="_blank" onclick="trackEvent('whatsapp_share', {ad_id: currentAd && currentAd.id ? currentAd.id : ''})">
  Поделиться в WhatsApp
</a>
        <a class="btn dark" href="index.html">Назад к объявлениям</a>

        <div class="desc">${ad.description || ""}</div>
      </div>
    </div>
  `;
}

async function incrementViews(id) {
  try {
    await fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({action:"view", id:id})
    });
  } catch(e) {}
}

async function loadAd() {
  const id = getId();

  if (!id) {
    renderAd(null);
    return;
  }

  try {
    const res = await fetch(WEB_APP_URL + "?id=" + encodeURIComponent(id) + "&t=" + Date.now(), {
      method: "GET",
      redirect: "follow"
    });

    const text = await res.text();
    const ad = JSON.parse(text);

    renderAd(ad && ad.id ? ad : null);
loadRelatedAds();
    if (ad && ad.id) {
      incrementViews(id);
    }

  } catch(e) {
    console.log(e);
    document.getElementById("content").innerHTML = "<p>Не удалось загрузить объявление.</p>";
  }
}

async function trackWhatsAppClick() {
  if (!currentAd || !currentAd.id) return;
  trackEvent("whatsapp_click", {
    ad_id: currentAd.id,
    category: currentAd.category || ""
  });

  await fetch(WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      action: "whatsappClick",
      id: currentAd.id
    })
  });
}

async function trackPhotoClick() {
  if (!currentAd || !currentAd.id) return;
  trackEvent("photo_click", {
    ad_id: currentAd.id,
    photo_index: currentPhoto
  });

  await fetch(WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify({
      action: "photoClick",
      id: currentAd.id
    })
  });
}

async function loadRelatedAds() {
  if (!currentAd) return;

  try {
    const res = await fetch(WEB_APP_URL + "?t=" + Date.now());
    const ads = await res.json();

    const related = ads
      .filter(a =>
        a.id !== currentAd.id &&
        a.category === currentAd.category
      )
      .slice(0, 4);

    const box = document.getElementById("relatedAds");
    if (!box) return;

    if (!related.length) {
      box.innerHTML = "Похожих объявлений пока нет";
      return;
    }

    box.innerHTML = related.map(ad => `
      <div class="related-item" onclick="location.href='ad.html?id=${ad.id}'">
        ${ad.photos && ad.photos[0]
          ? `<img src="${ad.photos[0]}">`
          : ""
        }
        <h3>${ad.title}</h3>
        <div class="related-price">${ad.price || ""} ₸</div>
      </div>
    `).join("");

  } catch(e) {
    console.log(e);
  }
}
function getShareUrl() {
  return currentAd && currentAd.id
    ? WEB_APP_URL + "?share=ad&id=" + encodeURIComponent(currentAd.id)
    : window.location.href;
}

function getWhatsAppShareUrl() {
  const text = currentAd && currentAd.title
    ? currentAd.title + "\n" + getShareUrl()
    : getShareUrl();

  return "https://wa.me/?text=" + encodeURIComponent(text);
}

function shareAd() {
  const url = getShareUrl();
  trackEvent("share_ad", {ad_id: currentAd && currentAd.id ? currentAd.id : ""});

  if (navigator.share) {
    navigator.share({
      title: document.title,
      text: currentAd && currentAd.title ? currentAd.title : "Посмотрите объявление на KARO Market",
      url: url
    });
  } else {
    navigator.clipboard.writeText(url);
    alert("Ссылка скопирована");
  }
}
document.addEventListener("keydown", function(event) {
  const lightbox = document.getElementById("lightbox");
  if (!lightbox || !lightbox.classList.contains("open")) return;

  if (event.key === "Escape") closeLightbox({target: lightbox});
  if (event.key === "ArrowRight") nextPhoto(event);
  if (event.key === "ArrowLeft") prevPhoto(event);
});
loadAd();
</script>

</body>
</html>
